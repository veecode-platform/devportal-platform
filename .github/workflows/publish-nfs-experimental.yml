# Experimental: publishes the isolated NFS host image as ONE immutable tag on
# the existing public veecode/devportal repository.
#
# Deliberately narrow:
#   - never writes :latest, :stable or any release tag;
#   - never touches publish.yml or the OFS Dockerfile;
#   - manual dispatch only, from this experimental branch;
#   - replicates scripts/build-local-nfs-image.sh (host artefacts first,
#     then Dockerfile.nfs) so the image is reproducible from the source commit.
name: Publish NFS experimental image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable tag to publish (suffix must contain -nfs)'
        required: true
        default: '2.3.0-rc.2-nfs.g07bc64b'

env:
  IMAGE_NAME: docker.io/veecode/devportal

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Refuse mutable or non-NFS tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            *-nfs*) ;;
            *) echo "tag must contain -nfs (immutable experimental tag)"; exit 1 ;;
          esac
          case "$TAG" in
            *latest*|*stable*) echo "mutable tag refused"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable yarn 4 (packageManager)
        run: corepack enable

      - name: Build host artefacts (same steps as build-local-nfs-image.sh)
        run: |
          yarn install --immutable
          NODE_OPTIONS="--max-old-space-size=6144" yarn workspace app-next tsc
          NODE_OPTIONS="--max-old-space-size=6144" yarn workspace app-next build
          NODE_OPTIONS="--max-old-space-size=6144" yarn build:backend

      - name: Sanity-check artefacts before docker build
        run: |
          test -f packages/backend/dist/skeleton.tar.gz
          test -f packages/backend/dist/bundle.tar.gz
          test -f packages/app-next/dist/index.html
          tar -tzf packages/backend/dist/skeleton.tar.gz | grep -F 'packages/app-next/package.json' >/dev/null
          tar -tzf packages/backend/dist/bundle.tar.gz | grep -F 'packages/app-next/dist/index.html' >/dev/null

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (Dockerfile.nfs, amd64, single immutable tag)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nfs
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            DEVPORTAL_VERSION=${{ steps.version.outputs.version }}

      - name: Record provenance
        env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## NFS experimental image"
            echo "- source commit: ${GITHUB_SHA}"
            echo "- tag: ${IMAGE_NAME}:${TAG}"
            echo "- digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
