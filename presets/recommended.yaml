name: recommended
description: Curated baseline — RBAC, tech radar, marketplace, pending-changes. No external integrations.
version: 1.0.0

# No required variables. The recommended preset assumes guest auth and no SCM
# integration. Add an integration preset to wire the portal to your stack, e.g.
# VEECODE_PRESETS=recommended,github
requires:
  variables: {}

# Each entry below is self-contained: package + pluginConfig live here.
# dynamic-plugins.default.yaml is documentation only (not in the runtime chain).
#
# Core chrome (global header, homepage, About, dynamic-plugins-info) is NOT
# here — it's always-on via dynamic-plugins.yaml. See presets/README.md "Tiers".
plugins:
  - package: oci://${PLUGIN_REGISTRY}/rbac:bs_1.49.4!backstage-community-plugin-rbac
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-rbac:
            dynamicRoutes:
              - path: /rbac
                importName: RbacPage
                menuItem:
                  text: RBAC
                  textKey: menuItem.rbac
                  icon: admin
                config:
                  props:
                    width: 1500
                    height: 800
            appIcons:
              - name: admin
                importName: RbacIcon
            menuItems:
              rbac:
                parent: admin
                title: RBAC
                titleKey: menuItem.rbac
                icon: admin

  - package: oci://${PLUGIN_REGISTRY}/tech-radar:bs_1.49.4!backstage-community-plugin-tech-radar
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-tech-radar:
            appIcons:
              - name: techRadar
                importName: TechRadarIcon
            dynamicRoutes:
              - path: /tech-radar
                importName: TechRadarPage
                menuItem:
                  icon: techRadar
                  text: Tech Radar
                  textKey: menuItem.techRadar
                config:
                  props:
                    width: 1500
                    height: 800

  - package: oci://${PLUGIN_REGISTRY}/tech-radar:bs_1.49.4!backstage-community-plugin-tech-radar-backend
    disabled: false

  - package: oci://${PLUGIN_REGISTRY}/marketplace:bs_${BACKSTAGE_VERSION}!devportal-marketplace-frontend-dynamic
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          devportal.marketplace-frontend:
            appIcons:
              - name: pluginsIcon
                importName: PluginsIcon
            dynamicRoutes:
              - path: /marketplace
                importName: DynamicExtensionsPluginRouter
                menuItem:
                  icon: pluginsIcon
                  text: Marketplace
            menuItems:
              marketplace:
                title: Marketplace
                icon: pluginsIcon

  - package: oci://${PLUGIN_REGISTRY}/marketplace:bs_${BACKSTAGE_VERSION}!devportal-marketplace-backend
    disabled: false

  - package: oci://${PLUGIN_REGISTRY}/marketplace:bs_${BACKSTAGE_VERSION}!devportal-pending-changes-dynamic
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          devportal.pending-changes:
            mountPoints:
              - mountPoint: global.header/component
                importName: PendingChangesButton
                config:
                  priority: 55
                  props:
                    pollingIntervalMs: 30000

  # ── Grafana (T-A.2, host admission only) ────────────────────────────
  # disabled: true on purpose — this preset has no required variables
  # today (see `requires.variables: {}` above) and Grafana needs
  # GRAFANA_DOMAIN + GRAFANA_TOKEN once enabled. Flip `disabled` here
  # (not in dynamic-plugins.default.yaml) once those are wired up.
  # `package:` must match dynamic-plugins.default.yaml character for
  # character — see docs/topics/plugin-packaging.md "Critical contract".
  - package: oci://${PLUGIN_REGISTRY}/grafana:bs_1.53.0!backstage-community-plugin-grafana
    disabled: true
    pluginConfig:
      grafana:
        domain: ${GRAFANA_DOMAIN:-}
        proxyPath: /grafana/api
      # proxy: lives here, not in app-config.yaml — proved (booted against the
      # published candidate image) that a `${GRAFANA_DOMAIN:-}` empty default
      # on `proxy.endpoints` in an unconditionally-loaded file collapses
      # `target:` to undefined and crashes the whole backend at boot. This
      # pluginConfig only merges once `disabled: false`, at which point
      # GRAFANA_DOMAIN/GRAFANA_TOKEN are expected to already be set — see
      # dynamic-plugins.default.yaml for the full write-up.
      proxy:
        endpoints:
          '/grafana/api':
            target: ${GRAFANA_DOMAIN}
            headers:
              Authorization: Bearer ${GRAFANA_TOKEN}
      dynamicPlugins:
        frontend:
          backstage-community.plugin-grafana:
            entityTabs:
              - path: /grafana-dashboard
                title: Grafana
                mountPoint: entity.page.grafana-dashboard
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: EntityGrafanaDashboardsCard
                config:
                  layout:
                    gridColumn: "1 / -1"
                  if:
                    allOf:
                      - hasAnnotation: grafana/dashboard-selector
              - mountPoint: entity.page.overview/cards
                importName: EntityGrafanaAlertsCard
                config:
                  layout:
                    gridColumn: "1 / -1"
                  if:
                    allOf:
                      - hasAnnotation: grafana/alert-label-selector
              - mountPoint: entity.page.grafana-dashboard/cards
                importName: EntityOverviewDashboardViewer
                config:
                  layout:
                    gridColumn: "1 / -1"
                  if:
                    allOf:
                      - hasAnnotation: grafana/overview-dashboard

# No app-config additions — the baseline runs on app-config.yaml plus the
# platform-level config files.
appConfig: {}
