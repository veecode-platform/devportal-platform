name: ldap-ad
description: Active Directory overrides for the `ldap` preset — switches the user attribute to `sAMAccountName` and remaps users/groups to AD's object classes. MUST compose with `ldap` (e.g. `VEECODE_PRESETS=ldap,ldap-ad`).
version: 2.2.0

# What this preset does:
#  - This preset is an OVERRIDE-ONLY layer on top of `ldap`. It re-declares the
#    `auth.providers.ldap.<ramp>.ldapAuthenticationOptions.usernameAttribute`
#    and the `catalog.providers.ldapOrg.default.users` / `.groups` blocks with
#    AD-flavored defaults (sAMAccountName, objectClass=user/group, richer `map:`).
#  - The usernameAttribute override MUST be declared on BOTH ramps, mirroring
#    `ldap`. Overriding only `production` means a NODE_ENV=development pod
#    resolves `ldap`'s development ramp and authenticates against `uid` — the
#    provider registers and login fails against a real AD, which is harder to
#    diagnose than the provider going missing outright.
#  - Composition order matters: list `ldap` BEFORE `ldap-ad` so the AD overrides
#    win (Backstage config loader: scalars + objects deep-merge, arrays replace —
#    later --config files win).
#  - Reuses every env var declared by `ldap` (LDAP_URL, LDAP_DN, LDAP_SECRET,
#    LDAP_USERS_BASE_DN, LDAP_GROUPS_BASE_DN, optional LDAP_USERS_FILTER /
#    LDAP_GROUPS_FILTER). No new required vars.
#  - The composition order ("ldap before ldap-ad") is enforced by
#    `requires.presets` — the resolver fails the boot (exit 78) otherwise.
requires:
  presets:
    - ldap

plugins: []

appConfig:
  auth:
    providers:
      ldap:
        production: &ldapAdAuthEnv
          ldapAuthenticationOptions:
            usernameAttribute: sAMAccountName
        # Must mirror `ldap`'s ramps, or a development pod falls back to `uid`.
        development: *ldapAdAuthEnv

  catalog:
    providers:
      ldapOrg:
        default:
          users:
            - dn: ${LDAP_USERS_BASE_DN}
              options:
                filter: ${LDAP_USERS_FILTER:-(&(objectClass=user)(!(objectClass=computer)))}
                # Paged search (RFC 2696) — NON-OPTIONAL against AD. AD caps any
                # single search at MaxPageSize (1000 by default); a corporate
                # directory over that makes the unpaged ingestion run abort with
                # SizeLimitExceededError, so the catalog ends up with NO User
                # entities and every login 404s with "User not found" even
                # though the LDAP bind succeeds. Mirrors `ldap` (arrays replace
                # on config merge, so this block must carry its own `paged`).
                paged: true
              map:
                rdn: cn
                name: sAMAccountName
                description: description
                displayName: displayName
                email: mail
                memberOf: memberOf
                picture: thumbnailPhoto
          groups:
            - dn: ${LDAP_GROUPS_BASE_DN}
              options:
                filter: ${LDAP_GROUPS_FILTER:-(objectClass=group)}
                paged: true
              map:
                rdn: cn
                name: cn
                description: description
                displayName: displayName
                email: mail
                memberOf: memberOf
                members: member
