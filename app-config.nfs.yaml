app:
  baseUrl: ${NFS_BASE_URL:-http://localhost:7007}
  packageName: app-next
  # Keep the NFS host's statically discovered frontend set explicit. Catalog is
  # the only static capability needed by this control's fixture route; the
  # dynamic fleet is configured by app-next/src/App.tsx and loaded at runtime.
  packages:
    include:
      - '@backstage/plugin-catalog'

backend:
  baseUrl: ${NFS_BASE_URL:-http://localhost:7007}
  cors:
    origin: ${NFS_BASE_URL:-http://localhost:7007}

catalog:
  locations:
    - type: file
      target: ${NFS_KUBERNETES_FIXTURE:-../../packages/app-next/fixtures/kubernetes-control.yaml}

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters: []
